  sections:
    summary:
      - "Ingeniero de Sistemas y Tech Lead con más de 7 años de trayectoria en la arquitectura, desarrollo y escalado de software en los sectores financiero y de telecomunicaciones. Especializado en microservicios, sistemas orientados a eventos (NestJS, Spring Boot, Quarkus, Kafka) y desarrollo Full Stack (Angular 16-22, React Native). Experiencia demostrada en la implementación de arquitecturas cloud resilientes (AWS), soluciones de procesamiento masivo a gran escala, integración estratégica de herramientas de IA en el ciclo de desarrollo de software (Copilot, OpenCode, agentes customizados) y patrones avanzados de seguridad y auditoría. [Este CV está versionado como código: github.com](https://github.com/josheluis96/curriculum-vitae)"
    
    experience:
      - company: "Banco Pichincha"
        position: "Frontend and Backend Developer / Tech Lead"
        location: "Quito, Ecuador"
        start_date: "2022-01"
        end_date: "present"
        summary: "Tecnologías utilizadas: React Native, NestJS, TypeScript, Angular (v16-v22), Node.js, Bun, AWS (S3, Glue, DynamoDB), Kafka, Redis, BullMQ, PostgreSQL, Browserless, Framebanking, Mambu, Dynatrace, GitHub Copilot, OpenCode"
        highlights:
          - "Procesamiento Masivo y Escalabilidad Horizontal: Diseñé e implementé la arquitectura del motor masivo de estados de cuenta utilizando BullMQ, NestJS y DynamoDB, logrando escalar de 10k/mes a 30k–50k envíos diarios únicamente mediante escalado horizontal de pods en la infraestructura, sin requerir refactorización de código."
          - "Arquitectura Cloud de Notificaciones Masivas (Push & Email): Diseñé una solución serverless y desacoplada basada en AWS S3 y AWS Glue para la distribución masiva de notificaciones, creando un modelo autoservicio altamente escalable que permite a cualquier equipo disparar campañas con trazabilidad de entrega y reportes automáticos de errores."
          - "Generación de Archivos a Escala: Desarrollé un microservicio dedicado e independiente para la generación de reportes masivos (PDF, Excel, XML) integrando Browserless, optimizando el consumo de recursos de plataforma y acelerando los tiempos de respuesta."
          - "Librerías Transversales, Auditoría y Seguridad: Diseñé una librería distribuida de auditoría mediante decoradores personalizados (@AuditKafka) y guards para interceptar comunicaciones en Kafka y GraphQL, garantizando la trazabilidad operativa y el cumplimiento normativo mediante la sanitización automática de datos sensibles."
          - "Desarrollo de Plataforma Web & Control de Accesos (RBAC): Lideré el desarrollo de herramientas de plataforma y back-office en Angular (migrado de v16 a v22) y Node.js, implementando un esquema granular de Control de Accesos Basado en Roles (RBAC) para elevar la seguridad y gobernanza operativa."
          - "Modernización y Seguridad de Dependencias: Ejecuté la migración estratégica de dependencias clave de NPM hacia Bun para reforzar estándares corporativos de seguridad y optimizar tiempos de construcción."
          - "Productividad e Ingeniería Asistida por IA: Integré tecnologías de IA (GitHub Copilot, OpenCode) en el flujo de trabajo del equipo, creando agentes de IA customizados para migraciones de código y automatizando las revisiones de Pull Requests (PRs) mediante prompts especializados."
          - "Documentación de Flujos e Iniciativas: Estandaricé la creación de documentación técnica por iniciativa, logrando un mapeo 1:1 entre la lógica funcional de negocio y la implementación en código."
          - "App Deuna: Desarrollo de flujos core (Onboarding y Login) para billetera digital en React Native (Android/iOS)."
          - "Pago de Comisiones: Optimización de acreditación masiva a comercios mediante NestJS, PostgreSQL, Kafka, Framebanking y Mambu."
      
      - company: "Global Hitss"
        position: "Líder de Proyectos & Arquitecto de Microservicios"
        location: "Guayaquil, Ecuador"
        start_date: "2018-01"
        end_date: "2022-01"
        summary: "Tecnologías utilizadas: Spring Boot, Quarkus, Angular, RabbitMQ, Redis, Docker, OpenShift, Oracle PL/SQL, Keycloak, Hadoop, Tableau"
        highlights:
          - "Motor de Crédito (Claro): Lideré la mejora de la arquitectura del ecosistema de microservicios asíncronos de análisis crediticio usando Spring Boot, Quarkus, Redis y RabbitMQ, reduciendo la intervención manual prácticamente al 0% y acelerando la evaluación de solicitudes en el canal comercial."
          - "Payback EDX: Automatización de procesos de negociación con clientes corporativos utilizando Keycloak, Angular y Oracle."
          - "Regularización: Sistema de procesamiento de órdenes de venta en línea y evaluación de penalizaciones integrando diversas fuentes de datos."
          - "BigData: Implementación de procesos ETL y análisis de datos en ecosistema de herramientas Hadoop, con Tableau como herramienta de visualización de datos."
      
      - company: "Sudamericana de Software"
